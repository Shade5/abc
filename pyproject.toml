[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-minimal"
version = "0.1.0"
description = "Minimal end-to-end release for the abc dataset and the ABC-DiT policy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch==2.11.0+cu128 ; sys_platform == 'linux'",
    "torchcodec==0.11.0+cpu ; sys_platform == 'linux'",
    "mujoco~=3.8.0",
    "mujoco-warp==3.8.0.3",
    "warp-lang==1.13.0",
    "mjviser",
    "viser",
    "imageio[ffmpeg]",
    "gymnasium>=1.1",
    "av",
    "ftfy",
    "regex",
    # Gemma 3 tokenizer used by ABC-VLA.
    "sentencepiece>=0.2.0",
    # tyro powers the dataclass CLI configs.
    "tyro",
    "huggingface_hub",
    "mcap",
    "mcap-protobuf-support",
    "wandb",
]

[project.optional-dependencies]
deploy = [
    "dynamixel-sdk",
    "evdev; sys_platform == 'linux'",
    "gymnasium>=1.1",
    "h5py",
    # note that this version carries correct gains for xdof data! the defaults in i2rt are wrong.
    "i2rt @ git+https://github.com/arthurallshire/i2rt-drivers.git@852f6fff33970fe9b882c53e6b28c66172c97291",
    "msgpack",
    "mink==1.1.0",
    "opencv-python",
    "pyrealsense2; sys_platform == 'linux'",
    "pyzmq",
    "websockets",
]
# deploy/adamo_server.py. 0.4.x: 1.0 drops the publish and video-receive APIs.
adamo = ["adamo==0.4.59", "fastapi", "uvicorn[standard]"]
dev = ["ruff"]

[tool.uv]
override-dependencies = [
    "mujoco~=3.8.0",
    "tyro>=1.0.5",
]

[tool.setuptools.packages.find]
include = ["abc_minimal*", "abc_sim*", "deploy*"]

[tool.setuptools.package-data]
abc_sim = ["models/*.xml", "models/assets_manifest.json"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
